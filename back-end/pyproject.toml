[project]
name = "multillm-bff"
version = "0.1.0"
description = "Authenticated streaming FastAPI BFF for the multi-LLM chat gateway"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",
    "azure-identity>=1.20,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "azure-cosmos>=4.9,<5",
    "azure-monitor-opentelemetry>=1.6,<2",
    "aiohttp>=3.11,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
